name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: CPU smoke test
        run: bash scripts/smoke_test.sh

      - name: Correctness unit tests
        run: |
          python3 -m pytest tests/test_acceptance_logic.py tests/test_capture_divergence_topk.py -q

      - name: No-secrets scan
        run: python3 scripts/check_no_secrets.py

      - name: Site claim safety
        run: python3 scripts/check_site_claims.py

      - name: Site artifact tests
        run: python3 -m pytest tests/test_site_artifacts.py -q

      - name: Release package validation
        run: python3 scripts/validate_final_release_package.py

      - name: Public git tag policy
        run: python3 scripts/verify_public_tags.py

      - name: Public claims audit
        run: python3 scripts/audit_public_claims.py
