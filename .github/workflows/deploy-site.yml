name: Deploy site

on:
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - "scripts/sync_site_data.sh"
      - "scripts/prepare_site_figure_assets.py"
      - "scripts/render_site_embedded_html.py"
      - "scripts/curate_site_case_studies.py"
      - "reports/public_release/leaderboard_final.json"
      - "docs/assets/public_exactkv_one_page_summary.png"
      - "docs/assets/exp035_first_divergence_histogram.png"
      - "docs/assets/exp035_category_heatmap.png"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install site build deps
        run: python -m pip install --upgrade pip pillow

      - name: Build self-contained site bundle
        run: bash scripts/sync_site_data.sh

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
