# ExactKV research release — conda environment for reproducibility.
# After create: pip install -e ".[dev]" from repo root (editable install).
name: exactkv-research-release
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch>=2.2
      - transformers>=4.40
      - accelerate>=0.29
      - safetensors>=0.4
      - numpy>=1.24
      - tqdm>=4.66
      - pytest>=8.0
      - pytest-timeout>=2.3
      - matplotlib>=3.8
      - pillow>=10.0
