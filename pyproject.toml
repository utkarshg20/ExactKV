[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exactkv"
version = "0.1.0"
description = "Lossy KV-cache compression. Exact full-KV outputs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "accelerate>=0.29",
    "safetensors>=0.4",
    "numpy>=1.24",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "matplotlib>=3.8",
    "pillow>=10.0",
]
# V6 Phase C: isolated kvpress backend evaluation (not installed by default).
# Pins transformers<5.3 per docs/KVPRESS_INTEGRATION_RESEARCH.md — separate
# from the default ExactKV environment which may use transformers 5.x.
kvpress = [
    "kvpress==0.5.3",
    "transformers>=4.56,<5.3",
]
# V9 Phase B: isolated TurboQuant Python adapter (not installed by default).
# The upstream ``turboquant`` package is dev-only inside TheTom/turboquant_plus —
# not on PyPI.  Clone that repo and set PYTHONPATH to its root in .venv-turboquant.
turboquant = [
    "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["exactkv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
